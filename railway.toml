[build]
builder = "NIXPACKS"
buildCommand = "npm install --include=dev --no-audit --no-fund && npx prisma generate && npm run build"

[deploy]
startCommand = "mkdir -p /data/db && npx prisma db push --skip-generate && node scripts/ensure-admin.js && node .next/standalone/server.js"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Railway volumes must be configured in the Railway dashboard:
# Service → Volumes → Add Volume → Mount path: /data
# This ensures the SQLite database survives deploys.

[env]
DATABASE_URL = "file:/data/db/custom.db"
NODE_ENV = "production"
