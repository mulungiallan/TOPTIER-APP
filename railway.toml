[build]
builder = "NIXPACKS"
buildCommand = "npm install --include=dev --no-audit --no-fund && npx prisma generate && npm run build"

[deploy]
startCommand = "npx prisma db push --skip-generate && node scripts/ensure-admin.js && node .next/standalone/server.js"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Postgres: attach a managed Postgres plugin in the Railway dashboard and its
# DATABASE_URL is injected automatically (do NOT override it below).

[env]
NODE_ENV = "production"
