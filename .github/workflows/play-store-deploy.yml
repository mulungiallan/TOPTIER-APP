name: Play Store Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to release to'
        required: true
        default: 'production'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  release:
    types: [published]

concurrency:
  group: play-store-deploy
  cancel-in-progress: false

env:
  TRACK: production

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node + sync Capacitor
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build web app (produces out/ webDir for Capacitor)
        run: npm run build
        env:
          CI: '1'
      - run: npx cap sync android

      - name: Resolve track
        id: track
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "track=${{ inputs.track }}" >> "$GITHUB_OUTPUT"
          else
            echo "track=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-increment versionCode + versionName
        shell: bash
        run: |
          set -e
          FILE=android/app/build.gradle
          VC=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$FILE")
          VN=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([0-9.]*\)".*/\1/p' "$FILE")
          NEW_VC=$((VC + 1))
          IFS='.' read -r MAJ MIN PATCH <<< "$VN"
          NEW_PATCH=$((PATCH + 1))
          NEW_VN="${MAJ}.${MIN}.${NEW_PATCH}"
          sed -i "s/^\([[:space:]]*versionCode[[:space:]]*\)[0-9][0-9]*/\1${NEW_VC}/" "$FILE"
          sed -i "s/^\([[:space:]]*versionName[[:space:]]*\"\)[0-9.]*\(\"\)/\1${NEW_VN}\2/" "$FILE"
          echo "Bumped versionCode ${VC} -> ${NEW_VC}, versionName ${VN} -> ${NEW_VN}"
          sed -n '/versionCode\|versionName/p' "$FILE"

      - name: Restore release keystore
        shell: bash
        run: |
          set -e
          mkdir -p android/keystore
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/toptier-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore/toptier-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Build signed release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.toptier.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ steps.track.outputs.track }}
          releaseStatus: completed
          whatsNewDirectory: playstore-release-notes/
