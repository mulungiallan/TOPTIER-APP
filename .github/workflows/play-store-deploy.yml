name: Play Store Deploy

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to release to'
        required: true
        default: 'production'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: 'Release status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - inProgress
          - draft
  release:
    types: [published]

concurrency:
  group: play-store-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node + sync Capacitor
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx cap sync android

      - name: Restore release keystore
        shell: bash
        run: |
          set -e
          mkdir -p android/keystore
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/toptier-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore/toptier-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Build signed release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.toptier.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event_name == 'release' && 'production' || inputs.track }}
          releaseStatus: ${{ github.event_name == 'release' && 'completed' || inputs.release_status }}
          whatsNewDirectory: playstore-release-notes/
